spring.application.name=vocabulary-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=test-secret-key-32-bytes-long-for-testing-1234567890-min-256-bits!
jwt.access-token-expiration=7200000
jwt.refresh-token-expiration=604800000

spring.security.oauth2.client.registration.google.client-id=mock-google-client-id
spring.security.oauth2.client.registration.google.client-secret=mock-google-client-secret
google.client-id=mock-google-client-id

cloudinary.cloud-name=mock-cloud
cloudinary.api-key=mock-key
cloudinary.api-secret=mock-secret

server.port=8080

