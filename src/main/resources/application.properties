spring.application.name=vocabulary

#Neon database
spring.datasource.url=jdbc:postgresql://localhost:5432/vocabulary

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#JWT
jwt.secret=dummy_jwt_secret_key_for_development_and_testing_purposes
jwt.access-token-expiration=7200000
jwt.refresh-token-expiration=604800000

# Log level t?ng quát
logging.level.root=INFO

# Log riêng cho package c?a b?n
logging.level.com.vtp.vocabulary=DEBUG

# Log Spring Security n?u ?ang debug auth/JWT
logging.level.org.springframework.security=DEBUG

# Log SQL Hibernate, ch? b?t khi c?n debug
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Ghi log ra file
logging.file.name=logs/app.log

# Format console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Format file
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n