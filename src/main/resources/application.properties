spring.application.name=vocabulary

#Neon database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vocabulary}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#JWT
jwt.secret=${JWT_SECRET:test-jwt-secret-key-must-be-at-least-256-bits-long-vtp}
jwt.access-token-expiration=${ACCESS_TOKEN_EXPIRATION:7200000}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION:604800000}

# Log level tong quat
logging.level.root=INFO

# Log rieng cho package
logging.level.com.vtp.vocabulary=DEBUG

# Log Spring Security
logging.level.org.springframework.security=DEBUG

# Log SQL Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Ghi log ra file
logging.file.name=logs/app.log

# Format console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Format file
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Login with google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

google.client-id=${GOOGLE_CLIENT_ID:google-client-id}

#Cloudinary
cloudinary.cloud-name=${CLOUD_NAME:cloud-name}
cloudinary.api-key=${CLOUD_API_KEY:api-key}
cloudinary.api-secret=${CLOUD_API_SECRET:api-secret}

server.port=${PORT:8080}
