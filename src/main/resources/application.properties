spring.application.name=vocabulary

#Neon database
spring.datasource.url=jdbc:postgresql://localhost:5432/vocabulary

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#JWT
jwt.secret=dummy_jwt_secret_key_for_development_and_testing_purposes
jwt.access-token-expiration=7200000
jwt.refresh-token-expiration=604800000

# Log level t?ng quát
logging.level.root=INFO

# Log riêng cho package c?a b?n
logging.level.com.vtp.vocabulary=DEBUG

# Log Spring Security n?u ?ang debug auth/JWT
logging.level.org.springframework.security=DEBUG

# Log SQL Hibernate, ch? b?t khi c?n debug
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Ghi log ra file
logging.file.name=logs/app.log

# Format console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Format file
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Login with google
spring.security.oauth2.client.registration.google.client-id=165389228730-bjhrdjbgpt6mbclht61b0sj98s6cfkib.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=dummy_google_client_secret
spring.security.oauth2.client.registration.google.scope=openid,email,profile

google.client-id=165389228730-bjhrdjbgpt6mbclht61b0sj98s6cfkib.apps.googleusercontent.com

#Cloudinary
cloudinary.cloud-name=dummy_cloud_name
cloudinary.api-key=dummy_cloudinary_api_key
cloudinary.api-secret=dummy_cloudinary_api_secret